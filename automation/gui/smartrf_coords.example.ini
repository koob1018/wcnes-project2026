[window]
; Optional. If empty, script uses current active window.
; title_contains=SmartRF Studio

title_contains=SmartRF

[coords]
; Replace with your real screen coordinates from Window Spy.
; All clicks are absolute screen coordinates.
base_freq_x=420
base_freq_y=260

data_rate_x=420
data_rate_y=300

deviation_x=420
deviation_y=340

rx_bw_x=420
rx_bw_y=380

start_button_x=980
start_button_y=220

stop_button_x=980
stop_button_y=220

packet_count_x=1020
packet_count_y=460

; Dump Data to File input box coordinates
dump_path_x=420
dump_path_y=540

[save]
; dump_field: write path into "Dump Data to File" field before capture
; ctrl_s: use Ctrl+S after stopping
mode=dump_field
